map $http_x_forwarded_proto $pms_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $http_x_request_id $pms_request_id {
    ""      $request_id;
    default $http_x_request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $pms_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-Id $pms_request_id;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
